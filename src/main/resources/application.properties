spring.application.name=shareride-mobile-backend
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8084}
server.address=0.0.0.0

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shareride_mobile}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

ors.api.key=${ORS_API_KEY}
ors.base-url=${ORS_BASE_URL:https://api.openrouteservice.org}

jwt.secret=${JWT_SECRET}
app.dev.expose-reset-token=${EXPOSE_RESET_TOKEN:false}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId:-app}] %-5level %logger{36} - %msg%n
